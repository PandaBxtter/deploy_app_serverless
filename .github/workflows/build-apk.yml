name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      code_zip_url:
        description: 'URL to zip of user code'
        required: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Download user code
        run: |
          mkdir -p ./capacitor-app/public
          curl -L "${{ github.event.inputs.code_zip_url }}" -o user-code.zip
          unzip user-code.zip -d ./capacitor-app/public/

      - name: Install dependencies
        working-directory: ./capacitor-app
        run: npm install

      - name: Build Web
        working-directory: ./capacitor-app
        run: npm run build

      - name: Add Android platform
        working-directory: ./capacitor-app
        run: npx cap add android

      - name: Copy Web to Native
        working-directory: ./capacitor-app
        run: npx cap copy android

      - name: Build APK
        run: |
          cd capacitor-app/android
          ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
